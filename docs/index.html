<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Earthquake Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>🌍 Global Earthquake Monitor</h1>
    <span id="meta-info"></span>
  </header>

  <section id="summary-cards">
    <div class="card"><div class="card-value" id="s-total">–</div><div class="card-label">Total Events</div></div>
    <div class="card"><div class="card-value" id="s-avg">–</div><div class="card-label">Avg Magnitude</div></div>
    <div class="card"><div class="card-value" id="s-max">–</div><div class="card-label">Max Magnitude</div></div>
    <div class="card"><div class="card-value" id="s-tsunami">–</div><div class="card-label">Tsunami Warnings</div></div>
  </section>

  <section id="filters">
    <div class="filter-group">
      <label>Date from</label>
      <input type="date" id="f-date-from" />
    </div>
    <div class="filter-group">
      <label>Date to</label>
      <input type="date" id="f-date-to" />
    </div>
    <div class="filter-group">
      <label>Min magnitude</label>
      <input type="number" id="f-mag-min" min="0" max="10" step="0.1" placeholder="0" />
    </div>
    <div class="filter-group">
      <label>Max magnitude</label>
      <input type="number" id="f-mag-max" min="0" max="10" step="0.1" placeholder="10" />
    </div>
    <div class="filter-group">
      <label>Max depth (km)</label>
      <input type="number" id="f-depth" min="0" step="10" placeholder="any" />
    </div>
    <div class="filter-group">
      <label>Alert level</label>
      <select id="f-alert">
        <option value="">All</option>
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
        <option value="orange">Orange</option>
        <option value="red">Red</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Tsunami</label>
      <select id="f-tsunami">
        <option value="">All</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Location search</label>
      <input type="text" id="f-place" placeholder="e.g. Japan" />
    </div>
    <button id="btn-apply">Apply filters</button>
    <button id="btn-reset">Reset</button>
  </section>

  <section id="map-section">
    <div id="map"></div>
  </section>

  <section id="charts">
    <div id="chart-timeline"></div>
    <div id="chart-magnitude"></div>
  </section>

  <section id="table-section">
    <h2>Recent Events <span id="table-count"></span></h2>
    <div id="table-wrapper">
      <table id="events-table">
        <thead>
          <tr>
            <th>Time (UTC)</th>
            <th>Place</th>
            <th>Magnitude</th>
            <th>Depth (km)</th>
            <th>Alert</th>
            <th>Tsunami</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
