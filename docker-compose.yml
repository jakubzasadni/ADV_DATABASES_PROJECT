services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-earthquakes}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 5

  collector:
    build: ./collector
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  exporter:
    build: ./exporter
    env_file: .env
    volumes:
      - ./docs/data:/app/output
    depends_on:
      db:
        condition: service_healthy
    profiles: ["export"]

volumes:
  pg_data:
